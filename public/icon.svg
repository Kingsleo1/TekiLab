<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />
  
  <!-- Pharmacy Medical Cross Shield -->
  <g filter="url(#shadow)">
    <!-- Horizontal arm -->
    <rect x="116" y="206" width="280" height="100" rx="24" fill="url(#crossGrad)" />
    <!-- Vertical arm -->
    <rect x="206" y="116" width="100" height="280" rx="24" fill="url(#crossGrad)" />
    <!-- Center pill overlay -->
    <circle cx="256" cy="256" r="54" fill="#FFFFFF" />
    <!-- Heartbeat / Vital pulse line in center -->
    <path d="M228 256 L242 256 L250 236 L262 276 L270 256 L284 256" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Green leaf/health badge -->
  <circle cx="360" cy="152" r="32" fill="url(#accentGrad)" filter="url(#shadow)" />
  <path d="M350 162 C346 148 358 138 372 138 C372 152 362 164 350 162 Z" fill="#FFFFFF" />
</svg>
